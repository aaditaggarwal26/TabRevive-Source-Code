<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabRevive - Keep Tabs Alive</title>
    <link rel="stylesheet" href="../shared/ui.css">
    <script src="../shared/ui.js"></script>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="header">
        <h1>
            <img class="header-icon" src="../../icons/logo.svg" width="24" height="24" alt="">
            TabRevive
        </h1>
        <p data-i18n="popupTagline">Keep tabs alive when switching away</p>
    </div>

    <div class="status-bar">
        <div class="status-indicator" id="globalStatus"></div>
        <div class="status-text" id="statusText"></div>
    </div>

    <div class="rate-bar" id="rateBar" hidden>
        <span data-i18n="rateAsk">Enjoying TabRevive?</span>
        <button class="rate-yes" id="rateYes" data-i18n="rateYes">Rate it</button>
        <button class="rate-no" id="rateNo" data-i18n="rateNo">No thanks</button>
    </div>

    <div class="stats">
        <div class="stat-card">
            <div class="stat-number" id="activeCount">0</div>
            <div class="stat-label" data-i18n="statProtected">Protected</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="totalTabs">0</div>
            <div class="stat-label" data-i18n="statOpenTabs">Open tabs</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="siteCount">0</div>
            <div class="stat-label" data-i18n="statSites">Sites</div>
        </div>
    </div>

    <div class="current-tab">
        <div class="section-title" data-i18n="sectionCurrentTab">Current Tab</div>
        <div class="tab-card" id="currentTabCard">
            <div class="tab-info">
                <img class="tab-favicon" id="currentFavicon" alt="" style="display: none;">
                <div class="tab-details">
                    <div class="tab-title" id="currentTitle" data-i18n="loading">Loading…</div>
                    <div class="tab-url" id="currentUrl"></div>
                </div>
            </div>
            <div class="tab-meta">
                <div class="tab-meta-item">
                    <span data-i18n="labelState">State</span>
                    <span id="tabStatus"></span>
                </div>
            </div>
            <button class="toggle-button" id="toggleButton" data-i18n="btnEnable">Make Always Active</button>
            <button class="feature-button" id="siteButton" style="width: 100%; margin-top: 8px;"></button>
        </div>
    </div>

    <div class="features-section">
        <div class="section-title" data-i18n="sectionQuick">Quick Actions</div>
        <div class="feature-grid">
            <button class="feature-button" id="refreshAllBtn">
                <svg class="feature-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
                <div data-i18n="actRefresh">Refresh Active</div>
            </button>
            <button class="feature-button" id="muteAllBtn">
                <svg class="feature-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>
                <div data-i18n="actMute">Mute All</div>
            </button>
            <button class="feature-button" id="exportBtn">
                <svg class="feature-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
                <div data-i18n="actExport">Export List</div>
            </button>
            <button class="feature-button" id="settingsBtn">
                <svg class="feature-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
                <div data-i18n="actSettings">Settings</div>
            </button>
        </div>
    </div>

    <div class="active-tabs">
        <div class="section-title">
            <span data-i18n="sectionActive">Active Tabs</span>
            <span style="margin-left: auto; font-size: 11px; color: var(--muted);" id="activeTabsCount">0</span>
        </div>
        <div id="activeTabsList">
            <div class="empty-state">
                <div class="empty-state-text" data-i18n="emptyTitle">No tabs are always active yet</div>
                <div class="empty-state-subtext" data-i18n="emptyHint">Click “Make Always Active” to start</div>
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="footer-text" id="footerText">TabRevive</div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
