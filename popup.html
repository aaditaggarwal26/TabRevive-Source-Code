<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabRevive - Keep Tabs Alive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 420px;
            min-height: 640px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            overflow: hidden;
        }

        .header {
            padding: 24px 24px 20px;
            background: #111111;
            border-bottom: 1px solid #222222;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-icon {
            width: 20px;
            height: 20px;
            background: #00cc66;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #000000;
            font-weight: 900;
        }

        .header p {
            font-size: 13px;
            color: #888888;
            font-weight: 400;
            line-height: 1.4;
        }

        .status-bar {
            background: #0f0f0f;
            padding: 12px 24px;
            border-bottom: 1px solid #222222;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00cc66;
            flex-shrink: 0;
        }

        .status-indicator.inactive {
            background: #ff4757;
        }

        .status-text {
            font-size: 12px;
            color: #cccccc;
            font-weight: 500;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            padding: 20px 24px;
            background: #0f0f0f;
            border-bottom: 1px solid #222222;
        }

        .stat-card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 14px;
            text-align: center;
            transition: border-color 0.15s;
        }

        .stat-card:hover {
            border-color: #3a3a3a;
        }

        .stat-number {
            font-size: 20px;
            font-weight: 800;
            color: #00cc66;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 10px;
            color: #666666;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .current-tab {
            padding: 20px 24px;
            background: #0a0a0a;
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: #cccccc;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-icon {
            font-size: 16px;
        }

        .tab-card {
            background: #161616;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 16px;
            transition: border-color 0.15s;
        }

        .tab-card:hover {
            border-color: #333333;
        }

        .tab-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .tab-favicon {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            background: #333333;
            flex-shrink: 0;
        }

        .tab-details {
            flex: 1;
            min-width: 0;
        }

        .tab-title {
            font-weight: 500;
            font-size: 14px;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .tab-url {
            font-size: 12px;
            color: #666666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tab-meta {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            font-size: 11px;
            color: #666666;
        }

        .tab-meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .toggle-button {
            background: #00cc66;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            color: #000000;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s;
            width: 100%;
        }

        .toggle-button:hover {
            background: #00b359;
        }

        .toggle-button.active {
            background: #e53e3e;
            color: #ffffff;
        }

        .toggle-button.active:hover {
            background: #c53030;
        }

        .features-section {
            padding: 20px 24px;
            background: #0a0a0a;
            border-top: 1px solid #222222;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .feature-button {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 12px;
            color: #cccccc;
            font-size: 12px;
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .feature-button:hover {
            border-color: #3a3a3a;
            color: #ffffff;
        }

        .feature-icon {
            font-size: 16px;
        }

        .active-tabs {
            padding: 20px 24px;
            max-height: 200px;
            overflow-y: auto;
            background: #0a0a0a;
        }

        .active-tab-item {
            background: #161616;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: border-color 0.15s;
        }

        .active-tab-item:hover {
            border-color: #333333;
        }

        .active-tab-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .activity-indicator {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #00cc66;
            flex-shrink: 0;
        }

        .activity-indicator.inactive {
            background: #555555;
        }

        .remove-button {
            background: #2a2a2a;
            border: none;
            border-radius: 6px;
            width: 28px;
            height: 28px;
            color: #aaaaaa;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.15s, color 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .remove-button:hover {
            background: #e53e3e;
            color: #ffffff;
        }

        .tab-favicon-small {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            background: #333333;
            flex-shrink: 0;
        }

        .active-tab-title {
            font-size: 13px;
            font-weight: 500;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .active-tab-url {
            font-size: 11px;
            color: #666666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666666;
        }

        .empty-state-icon {
            font-size: 32px;
            margin-bottom: 12px;
            opacity: 0.6;
        }

        .empty-state-text {
            font-size: 13px;
            margin-bottom: 6px;
        }

        .empty-state-subtext {
            font-size: 11px;
            color: #555555;
        }

        .footer {
            padding: 16px 24px;
            background: #111111;
            border-top: 1px solid #222222;
            text-align: center;
        }

        .footer-text {
            font-size: 11px;
            color: #666666;
            line-height: 1.4;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #333333;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #444444;
        }

        .notification {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #00cc66;
            color: #000000;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            opacity: 0;
            transform: translateX(100%);
            transition: opacity 0.2s, transform 0.2s;
            z-index: 1000;
        }

        .notification.show {
            opacity: 1;
            transform: translateX(0);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>
            <div class="header-icon">TR</div>
            TabRevive - Keep Tabs Alive
        </h1>
        <p>Keep tabs alive when switching away</p>
    </div>

    <div class="status-bar">
        <div class="status-indicator" id="globalStatus"></div>
        <div class="status-text" id="statusText">Extension Ready</div>
    </div>

    <div class="stats">
        <div class="stat-card">
            <div class="stat-number" id="activeCount">0</div>
            <div class="stat-label">Active</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="totalTabs">0</div>
            <div class="stat-label">Total</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="uptime">0s</div>
            <div class="stat-label">Uptime</div>
        </div>
    </div>

    <div class="current-tab">
        <div class="section-title">
            <span class="section-icon">TAB</span>
            Current Tab
        </div>
        <div class="tab-card" id="currentTabCard">
            <div class="tab-info">
                <img class="tab-favicon" id="currentFavicon" src="" alt="">
                <div class="tab-details">
                    <div class="tab-title" id="currentTitle">Loading...</div>
                    <div class="tab-url" id="currentUrl">...</div>
                </div>
            </div>
            <div class="tab-meta">
                <div class="tab-meta-item">
                    <span>MEM</span>
                    <span id="tabMemory">-</span>
                </div>
                <div class="tab-meta-item">
                    <span>AGE</span>
                    <span id="tabAge">-</span>
                </div>
                <div class="tab-meta-item">
                    <span>STATE</span>
                    <span id="tabStatus">Loading</span>
                </div>
            </div>
            <button class="toggle-button" id="toggleButton">Make Always Active</button>
        </div>
    </div>

    <div class="features-section">
        <div class="section-title">
            <span class="section-icon">TOOLS</span>
            Quick Actions
        </div>
        <div class="feature-grid">
            <button class="feature-button" id="refreshAllBtn">
                <div class="feature-icon">REF</div>
                <div>Refresh Active</div>
            </button>
            <button class="feature-button" id="muteAllBtn">
                <div class="feature-icon">MUTE</div>
                <div>Mute All</div>
            </button>
            <button class="feature-button" id="exportBtn">
                <div class="feature-icon">EXP</div>
                <div>Export List</div>
            </button>
            <button class="feature-button" id="settingsBtn">
                <div class="feature-icon">SET</div>
                <div>Settings</div>
            </button>
        </div>
    </div>

    <div class="active-tabs">
        <div class="section-title">
            <span class="section-icon">ON</span>
            Active Tabs
            <span style="margin-left: auto; font-size: 11px; color: #666666;" id="activeTabsCount">0</span>
        </div>
        <div id="activeTabsList">
            <div class="empty-state">
                <div class="empty-state-icon">*</div>
                <div class="empty-state-text">No tabs are always active yet</div>
                <div class="empty-state-subtext">Click "Make Always Active" to start</div>
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="footer-text">TabRevive 2.0.4</div>
    </div>

    <div class="notification" id="notification"></div>

    <script src="popup.js"></script>
</body>
</html>
